name: Force Deploy Refined VelocityRE Funnel

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/force-deploy-current.yml"

permissions:
  contents: read

env:
  SERVER_HOST: 87.99.155.241
  SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
  SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  deploy:
    name: Deploy merged main and verify Market Starter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: velocityre-production
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy current main to the live container
        shell: bash
        run: ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=12 "$SERVER_USER@$SERVER_HOST" 'bash -s' < scripts/deploy-live.sh

      - name: Verify the public three-plan page
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            url="https://properties.leadsbystorm.com/?force_deploy=${GITHUB_SHA}-$(date +%s)-${attempt}"
            html="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url")"
            if printf '%s' "$html" | grep -q 'Market Starter'; then
              echo 'public_page=refined-three-plan-version'
              exit 0
            fi
            sleep 5
          done
          echo '::error::The refined three-plan page is not live.'
          exit 1
