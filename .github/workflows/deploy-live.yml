name: Inspect Live VelocityRE Routing

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-live.yml"
      - "scripts/inspect-live.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_HOST: 87.99.155.241
  SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
  SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  inspect:
    name: Identify the service serving properties.leadsbystorm.com
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Inspect application processes and Traefik routing
        shell: bash
        run: ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=12 "$SERVER_USER@$SERVER_HOST" 'bash -s' < scripts/inspect-live.sh
