name: Verify Live VelocityRE Public Response

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify properties.leadsbystorm.com externally
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve domain and verify redesigned offer
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DNS ==='
          getent ahostsv4 properties.leadsbystorm.com | awk '{print $1}' | sort -u

          for attempt in {1..12}; do
            url="https://properties.leadsbystorm.com/?deployment_check=$(date +%s)-${attempt}"
            html="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url")"
            if printf '%s' "$html" | grep -q 'Agent-Driven Program'; then
              echo 'public_page=new'
              echo 'new_offer_marker=Agent-Driven Program'
              exit 0
            fi
            if printf '%s' "$html" | grep -q 'Reach Tomorrow'; then
              echo "attempt=${attempt} public_page=old"
            else
              echo "attempt=${attempt} public_page=unknown"
            fi
            sleep 5
          done

          echo '::error::The public URL is not serving the redesigned offer.'
          exit 1
