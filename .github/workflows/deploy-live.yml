name: Deploy Live VelocityRE

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-live.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - ".github/workflows/deploy-live.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_HOST: 87.99.155.241
  SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
  SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.HETZNER_SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}

jobs:
  preflight:
    name: Verify server access
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an existing SSH key secret
        shell: bash
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::No SSH deployment key was found. Configure SSH_PRIVATE_KEY, HETZNER_SSH_PRIVATE_KEY, or SERVER_SSH_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh

          # Accept normal multiline keys, Windows CRLF keys, literal \n strings,
          # and base64-encoded private keys.
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' | sed 's/\\n/\
/g' > ~/.ssh/deploy_key

          if ! grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/deploy_key; then
            if printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/deploy_key.decoded 2>/dev/null \
              && grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/deploy_key.decoded; then
              mv ~/.ssh/deploy_key.decoded ~/.ssh/deploy_key
              tr -d '\r' < ~/.ssh/deploy_key > ~/.ssh/deploy_key.normalized
              mv ~/.ssh/deploy_key.normalized ~/.ssh/deploy_key
            else
              rm -f ~/.ssh/deploy_key.decoded
              echo "::error::SSH_PRIVATE_KEY is not a valid private key. Paste the complete key, including BEGIN/END PRIVATE KEY lines."
              exit 1
            fi
          fi

          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Verify the live application directory
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=12 "$SERVER_USER@$SERVER_HOST" \
            'test -d /opt/velo && echo "Server access confirmed: /opt/velo exists."'

  deploy:
    name: Build and deploy to Hetzner
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: velocityre-production
      cancel-in-progress: false
    steps:
      - name: Require an existing SSH key secret
        shell: bash
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::No SSH deployment key was found. Configure SSH_PRIVATE_KEY, HETZNER_SSH_PRIVATE_KEY, or SERVER_SSH_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' | sed 's/\\n/\
/g' > ~/.ssh/deploy_key

          if ! grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/deploy_key; then
            if printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/deploy_key.decoded 2>/dev/null \
              && grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/deploy_key.decoded; then
              mv ~/.ssh/deploy_key.decoded ~/.ssh/deploy_key
              tr -d '\r' < ~/.ssh/deploy_key > ~/.ssh/deploy_key.normalized
              mv ~/.ssh/deploy_key.normalized ~/.ssh/deploy_key
            else
              rm -f ~/.ssh/deploy_key.decoded
              echo "::error::SSH_PRIVATE_KEY is not a valid private key. Paste the complete key, including BEGIN/END PRIVATE KEY lines."
              exit 1
            fi
          fi

          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Pull, build, and restart VelocityRE
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=12 "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/velo
          git fetch --prune origin main
          git reset --hard origin/main
          npm ci
          npm run build

          restart_with_systemd() {
            for service in velo velocityre properties; do
              if systemctl list-unit-files "${service}.service" --no-legend 2>/dev/null | grep -q "${service}.service"; then
                if [ "$(id -u)" -eq 0 ]; then
                  systemctl restart "${service}.service"
                  systemctl is-active --quiet "${service}.service"
                else
                  sudo systemctl restart "${service}.service"
                  sudo systemctl is-active --quiet "${service}.service"
                fi
                echo "Restarted ${service}.service"
                return 0
              fi
            done
            return 1
          }

          restart_with_pm2() {
            command -v pm2 >/dev/null 2>&1 || return 1
            if pm2 describe velo >/dev/null 2>&1; then
              pm2 restart velo --update-env
            elif pm2 describe velocityre >/dev/null 2>&1; then
              pm2 restart velocityre --update-env
            else
              return 1
            fi
            pm2 save
            echo "Restarted the PM2 application"
          }

          restart_with_docker() {
            command -v docker >/dev/null 2>&1 || return 1
            if [ -f docker-compose.yml ] || [ -f compose.yml ] || [ -f compose.yaml ]; then
              docker compose up -d --build
              echo "Rebuilt the Docker Compose application"
              return 0
            fi
            return 1
          }

          restart_with_systemd || restart_with_pm2 || restart_with_docker || {
            echo "No recognized VelocityRE systemd service, PM2 process, or Docker Compose deployment was found."
            exit 1
          }
          REMOTE

      - name: Verify live page
        shell: bash
        run: |
          for attempt in {1..12}; do
            html="$(curl --fail --silent --show-error --location --max-time 15 https://properties.leadsbystorm.com/ || true)"
            if printf '%s' "$html" | grep -q 'One Listing Guaranteed'; then
              echo "Live VelocityRE page is serving the redesigned funnel."
              exit 0
            fi
            sleep 5
          done

          echo "::error::Deployment completed, but the redesigned headline was not found on the live page."
          exit 1
