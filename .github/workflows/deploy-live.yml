name: Diagnose and Deploy Live VelocityRE

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-live.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_HOST: 87.99.155.241
  SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
  SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
  KEY_SSH_PRIVATE: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_HETZNER_PRIVATE: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
  KEY_SERVER_PRIVATE: ${{ secrets.SERVER_SSH_KEY }}

jobs:
  deploy:
    name: Deploy main and verify live service
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: velocityre-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          candidates = [
              os.environ.get("KEY_SSH_PRIVATE", ""),
              os.environ.get("KEY_HETZNER_PRIVATE", ""),
              os.environ.get("KEY_SERVER_PRIVATE", ""),
          ]

          def normalize(value: str) -> str:
              raw = value.replace("\r", "").replace("\\n", "\n").strip()
              if "PRIVATE KEY-----" in raw:
                  return raw
              try:
                  decoded = base64.b64decode(raw).decode("utf-8").replace("\r", "").strip()
              except Exception:
                  return ""
              return decoded if "PRIVATE KEY-----" in decoded else ""

          key = next((normalize(value) for value in candidates if normalize(value)), "")
          if not key:
              raise SystemExit("No valid OpenSSH private key is configured.")

          Path.home().joinpath(".ssh/deploy_key").write_text(key.rstrip() + "\n")
          PY
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Pull, build, identify service, and restart
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=12 "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/velo
          echo "Application directory confirmed: $(pwd)"
          echo "Commit before deployment: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

          git fetch --prune origin main
          git reset --hard origin/main
          echo "Commit after deployment: $(git rev-parse --short HEAD)"

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          npm ci
          npm run build
          echo "Production build completed on the server."

          restart_with_systemd() {
            for service in velo velocityre properties; do
              if systemctl list-unit-files "${service}.service" --no-legend 2>/dev/null | grep -q "${service}.service"; then
                systemctl restart "${service}.service"
                systemctl is-active --quiet "${service}.service"
                echo "Restarted systemd service: ${service}.service"
                return 0
              fi
            done
            return 1
          }

          restart_with_pm2() {
            command -v pm2 >/dev/null 2>&1 || return 1
            for process in velo velocityre properties; do
              if pm2 describe "$process" >/dev/null 2>&1; then
                pm2 restart "$process" --update-env
                pm2 save
                echo "Restarted PM2 process: $process"
                return 0
              fi
            done
            return 1
          }

          restart_with_compose() {
            command -v docker >/dev/null 2>&1 || return 1
            if [ -f docker-compose.yml ] || [ -f compose.yml ] || [ -f compose.yaml ]; then
              docker compose up -d --build
              echo "Rebuilt Docker Compose application."
              return 0
            fi
            return 1
          }

          restart_matching_container() {
            command -v docker >/dev/null 2>&1 || return 1
            container="$(docker ps --format '{{.Names}}' | grep -Ei 'velo|velocityre|properties' | head -n 1 || true)"
            [ -n "$container" ] || return 1
            docker restart "$container"
            echo "Restarted matching Docker container: $container"
            return 0
          }

          restart_with_systemd || restart_with_pm2 || restart_with_compose || restart_matching_container || {
            echo "No recognized live service was found."
            echo "Matching systemd units:"
            systemctl list-unit-files --type=service --no-legend 2>/dev/null | grep -Ei 'velo|velocity|propert|next' || true
            echo "PM2 process names:"
            if command -v pm2 >/dev/null 2>&1; then pm2 jlist | python3 -c 'import json,sys; print("\n".join(x.get("name", "") for x in json.load(sys.stdin)))' || true; fi
            echo "Docker container names:"
            if command -v docker >/dev/null 2>&1; then docker ps --format '{{.Names}}' || true; fi
            exit 1
          }
          REMOTE

      - name: Verify redesigned page is live
        shell: bash
        run: |
          for attempt in {1..18}; do
            html="$(curl --fail --silent --show-error --location --max-time 15 https://properties.leadsbystorm.com/ || true)"
            if printf '%s' "$html" | grep -q '50 Seller Opportunities. One Listing Guaranteed.'; then
              echo "The redesigned VelocityRE funnel is live."
              exit 0
            fi
            sleep 5
          done

          echo "::error::The server deployment ran, but the redesigned headline is not live."
          exit 1
