name: Deploy Live VelocityRE

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-live.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - ".github/workflows/deploy-live.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_HOST: 87.99.155.241
  SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
  SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
  KEY_SSH_PRIVATE: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_HETZNER_PRIVATE: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
  KEY_SERVER_PRIVATE: ${{ secrets.SERVER_SSH_KEY }}

jobs:
  preflight:
    name: Verify server access
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          candidates = [
              ("SSH_PRIVATE_KEY", os.environ.get("KEY_SSH_PRIVATE", "")),
              ("HETZNER_SSH_PRIVATE_KEY", os.environ.get("KEY_HETZNER_PRIVATE", "")),
              ("SERVER_SSH_KEY", os.environ.get("KEY_SERVER_PRIVATE", "")),
          ]

          def normalize(value: str) -> str:
              raw = value.replace("\r", "").replace("\\n", "\n").strip()
              if "PRIVATE KEY-----" in raw:
                  return raw
              try:
                  decoded = base64.b64decode(raw).decode("utf-8").replace("\r", "").strip()
              except Exception:
                  return ""
              return decoded if "PRIVATE KEY-----" in decoded else ""

          chosen_name = ""
          chosen_key = ""
          configured = []
          for name, value in candidates:
              if value:
                  configured.append(name)
              normalized = normalize(value)
              if normalized and not chosen_key:
                  chosen_name = name
                  chosen_key = normalized

          if not chosen_key:
              present = ", ".join(configured) if configured else "none"
              raise SystemExit(
                  f"No valid OpenSSH private key was found. Configured secret names: {present}. "
                  "Paste the complete private key file contents into one of the supported secrets."
              )

          Path.home().joinpath(".ssh/deploy_key").write_text(chosen_key.rstrip() + "\n")
          print(f"Using validated key from {chosen_name}.")
          PY
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Verify the live application directory
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=12 "$SERVER_USER@$SERVER_HOST" \
            'test -d /opt/velo && echo "Server access confirmed: /opt/velo exists."'

  deploy:
    name: Build and deploy to Hetzner
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: velocityre-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          candidates = [
              ("SSH_PRIVATE_KEY", os.environ.get("KEY_SSH_PRIVATE", "")),
              ("HETZNER_SSH_PRIVATE_KEY", os.environ.get("KEY_HETZNER_PRIVATE", "")),
              ("SERVER_SSH_KEY", os.environ.get("KEY_SERVER_PRIVATE", "")),
          ]

          def normalize(value: str) -> str:
              raw = value.replace("\r", "").replace("\\n", "\n").strip()
              if "PRIVATE KEY-----" in raw:
                  return raw
              try:
                  decoded = base64.b64decode(raw).decode("utf-8").replace("\r", "").strip()
              except Exception:
                  return ""
              return decoded if "PRIVATE KEY-----" in decoded else ""

          chosen_name = ""
          chosen_key = ""
          configured = []
          for name, value in candidates:
              if value:
                  configured.append(name)
              normalized = normalize(value)
              if normalized and not chosen_key:
                  chosen_name = name
                  chosen_key = normalized

          if not chosen_key:
              present = ", ".join(configured) if configured else "none"
              raise SystemExit(
                  f"No valid OpenSSH private key was found. Configured secret names: {present}. "
                  "Paste the complete private key file contents into one of the supported secrets."
              )

          Path.home().joinpath(".ssh/deploy_key").write_text(chosen_key.rstrip() + "\n")
          print(f"Using validated key from {chosen_name}.")
          PY
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Pull, build, and restart VelocityRE
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=12 "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/velo
          git fetch --prune origin main
          git reset --hard origin/main
          npm ci
          npm run build

          restart_with_systemd() {
            for service in velo velocityre properties; do
              if systemctl list-unit-files "${service}.service" --no-legend 2>/dev/null | grep -q "${service}.service"; then
                if [ "$(id -u)" -eq 0 ]; then
                  systemctl restart "${service}.service"
                  systemctl is-active --quiet "${service}.service"
                else
                  sudo systemctl restart "${service}.service"
                  sudo systemctl is-active --quiet "${service}.service"
                fi
                echo "Restarted ${service}.service"
                return 0
              fi
            done
            return 1
          }

          restart_with_pm2() {
            command -v pm2 >/dev/null 2>&1 || return 1
            if pm2 describe velo >/dev/null 2>&1; then
              pm2 restart velo --update-env
            elif pm2 describe velocityre >/dev/null 2>&1; then
              pm2 restart velocityre --update-env
            else
              return 1
            fi
            pm2 save
            echo "Restarted the PM2 application"
          }

          restart_with_docker() {
            command -v docker >/dev/null 2>&1 || return 1
            if [ -f docker-compose.yml ] || [ -f compose.yml ] || [ -f compose.yaml ]; then
              docker compose up -d --build
              echo "Rebuilt the Docker Compose application"
              return 0
            fi
            return 1
          }

          restart_with_systemd || restart_with_pm2 || restart_with_docker || {
            echo "No recognized VelocityRE systemd service, PM2 process, or Docker Compose deployment was found."
            exit 1
          }
          REMOTE

      - name: Verify live page
        shell: bash
        run: |
          for attempt in {1..12}; do
            html="$(curl --fail --silent --show-error --location --max-time 15 https://properties.leadsbystorm.com/ || true)"
            if printf '%s' "$html" | grep -q 'One Listing Guaranteed'; then
              echo "Live VelocityRE page is serving the redesigned funnel."
              exit 0
            fi
            sleep 5
          done

          echo "::error::Deployment completed, but the redesigned headline was not found on the live page."
          exit 1
