name: Validate and Deploy Live VelocityRE

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "scripts/deploy-live.sh"
      - ".github/workflows/deploy-live.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "scripts/deploy-live.sh"
      - ".github/workflows/deploy-live.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_HOST: 87.99.155.241
  SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
  SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  validate:
    name: Validate Next.js production build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

  deploy:
    name: Deploy territory-lock application to Hetzner
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/deploy-product-led-page'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: velocityre-production
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Pull main, rebuild territory-lock-app, and verify locally
        shell: bash
        run: ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=12 "$SERVER_USER@$SERVER_HOST" 'bash -s' < scripts/deploy-live.sh

      - name: Verify pilot package publicly
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            url="https://properties.leadsbystorm.com/?deployment_check=${GITHUB_SHA}-$(date +%s)-${attempt}"
            html="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url")"
            if printf '%s' "$html" | grep -q 'The intelligent off-market listing engine'; then
              echo 'Public deployment verification passed.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::The public domain did not return the current pilot package.'
          exit 1
